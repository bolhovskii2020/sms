<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Сообщения</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:17px/1.3 -apple-system,system-ui,Roboto,sans-serif;background:#fff;color:#000;display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));background:#f7f7f7;border-bottom:1px solid #ddd;font-size:13px;color:#888}
#dot{width:8px;height:8px;border-radius:50%;background:#bbb}
#dot.on{background:#1ac81a}
#list{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.m{max-width:75%;padding:8px 14px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:#1ac81a;color:#fff}
.them{align-self:flex-start;background:#e5e5ea;color:#000}
.me+.them,.them+.me{margin-top:8px}
.info{align-self:center;font-size:12px;color:#999;margin:10px 0 4px}
.wait{align-self:flex-end;font-size:11px;color:#999;margin-top:-2px}
#bar{display:flex;align-items:center;gap:8px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:#f7f7f7;border-top:1px solid #ddd}
#more{width:34px;height:30px;border:0;border-radius:6px;background:#888;color:#fff;font-size:18px;cursor:pointer}
#box{flex:1;display:flex;align-items:flex-end;border:1px solid #bbb;border-radius:20px;background:#fff;padding:3px 3px 3px 12px}
textarea{flex:1;resize:none;border:0;outline:0;background:none;font:inherit;padding:5px 0;max-height:120px}
#send{width:30px;height:30px;border:0;border-radius:50%;background:#1ac81a;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;flex:none}
#send:disabled{background:#ccc}
#invite{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:20px}
#invite div{background:#fff;border-radius:16px;padding:20px;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px}
#invite button{padding:12px;border:0;border-radius:12px;background:#1ac81a;color:#fff;font:inherit;cursor:pointer}
#invite button.sec{background:#eee;color:#333}
#invite p{color:#666;font-size:15px}
.hide{display:none!important}
</style>
</head>
<body>
<header><span id="dot"></span><span id="st">подключение…</span></header>
<div id="list"></div>
<div id="bar">
  <button id="more" title="Меню">›</button>
  <div id="box"><textarea id="txt" rows="1" maxlength="2000" placeholder="SMS/MMS"></textarea><button id="send" disabled>↑</button></div>
</div>

<div id="invite" class="hide"><div>
  <b>Пригласите собеседника</b>
  <p>Отправьте ему эту ссылку любым способом. Он откроет её — и можно переписываться. Делается один раз.</p>
  <button id="share">Отправить ссылку</button>
  <button id="close" class="sec">Готово</button>
</div></div>

<script>
// Доставка: зашифрованные сообщения через бесплатный сервис ntfy.sh
// (хранит их до 12 ч, так что собеседнику не обязательно быть онлайн).
const SERVER=new URLSearchParams(location.search).get('srv')||'https://ntfy.sh';
const $=s=>document.querySelector(s);
const LS='duo-sms-v1';
let S=null;try{S=JSON.parse(localStorage.getItem(LS))}catch{}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch{}};

// ---------- пара устройств по ссылке ----------
const inv=new URLSearchParams(location.hash.slice(1)).get('invite');
if(inv&&/^[0-9a-f]{16,64}$/.test(inv)&&(!S||S.code!==inv)){
  if(!(S&&S.msgs.length)||confirm('Подключиться к новому собеседнику? Текущая переписка на этом телефоне будет удалена.')){
    S={code:inv,me:2,msgs:[]};save();
  }
}
if(inv)history.replaceState(null,'',location.pathname+location.search);
if(!S){
  const a=new Uint8Array(16);crypto.getRandomValues(a);
  S={code:[...a].map(x=>x.toString(16).padStart(2,'0')).join(''),me:1,msgs:[]};save();
}
S.msgs=S.msgs||[];
const link=()=>location.origin+location.pathname+location.search+'#invite='+S.code;

$('#share').onclick=async()=>{
  try{if(navigator.share){await navigator.share({title:'Сообщения',url:link()});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(link());alert('Ссылка скопирована')}catch{prompt('Скопируйте ссылку:',link())}
};
$('#close').onclick=()=>$('#invite').classList.add('hide');
if(S.me===1&&!S.paired)$('#invite').classList.remove('hide');

// ---------- шифрование ----------
let KEY,TOPIC;
const b64=u=>btoa(String.fromCharCode(...u));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function initCrypto(){
  const enc=new TextEncoder();
  const h1=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode('topic:'+S.code)));
  TOPIC='duo'+[...h1].slice(0,20).map(x=>x.toString(16).padStart(2,'0')).join('');
  const h2=await crypto.subtle.digest('SHA-256',enc.encode('key:'+S.code));
  KEY=await crypto.subtle.importKey('raw',h2,'AES-GCM',false,['encrypt','decrypt']);
}
async function seal(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(obj))));
  const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);
  return 'e1.'+b64(all);
}
async function open_(s){
  if(typeof s!=='string'||!s.startsWith('e1.'))return null;
  try{const u=unb64(s.slice(3));
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12))));
  }catch{return null}
}

// ---------- сеть ----------
let es=null,online=false;
async function publish(obj){
  const r=await fetch(SERVER+'/'+TOPIC,{method:'POST',body:await seal(obj)});
  if(!r.ok)throw new Error('HTTP '+r.status);
}
function connect(){
  if(es)es.close();
  const since=S.last||'12h';
  es=new EventSource(SERVER+'/'+TOPIC+'/sse?since='+encodeURIComponent(since));
  es.addEventListener('open',()=>{online=true;status();flush()});
  es.onmessage=async e=>{
    let ev;try{ev=JSON.parse(e.data)}catch{return}
    if(ev.event!=='message')return;
    S.last=ev.id;save();
    const d=await open_(ev.message);
    if(d)onData(d);
  };
  es.onerror=()=>{online=false;status();es.close();es=null;setTimeout(()=>{if(!es)connect()},4000)};
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!es||es.readyState===2))connect()});
window.addEventListener('online',()=>connect());

let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{
    if(!S.helloSent){await publish({k:'hi',f:S.me});S.helloSent=1;save()}
    const now=Date.now();
    for(const m of S.msgs){
      if(m.from!==S.me||m.ok)continue;
      // не отправлено, или отправлено давно (сервер хранит 12 ч) — отправляем снова
      if(!m.pub||now-m.pub>11*3600e3){await publish({k:'m',f:S.me,id:m.id,text:m.text,ts:m.ts});m.pub=Date.now();save()}
    }
    render();
  }catch(e){console.warn(e)}
  flushing=false;
}

let ackQ=[],ackT=0;
function ack(id){ackQ.push(id);clearTimeout(ackT);ackT=setTimeout(async()=>{const ids=ackQ;ackQ=[];try{await publish({k:'a',f:S.me,ids})}catch{ackQ.push(...ids)}},400)}

function onData(d){
  if(d.f===S.me)return;               // своё эхо
  if(!S.paired){S.paired=1;save();$('#invite').classList.add('hide');status()}
  if(d.k==='hi'){if(!S.helloBack){S.helloBack=1;save();publish({k:'hi',f:S.me}).catch(()=>{})}return}
  if(d.k==='m'&&typeof d.text==='string'&&typeof d.id==='string'){
    if(!S.msgs.some(x=>x.id===d.id)){
      S.msgs.push({id:d.id,from:3-S.me,text:d.text.slice(0,5000),ts:+d.ts||Date.now(),ok:1});
      S.msgs.sort((a,b)=>a.ts-b.ts);save();render();notify(d.text);
    }
    ack(d.id);
  } else if(d.k==='a'&&Array.isArray(d.ids)){
    let ch=0;for(const m of S.msgs)if(m.from===S.me&&!m.ok&&d.ids.includes(m.id)){m.ok=1;ch=1}
    if(ch){save();render()}
  }
}
function status(){
  $('#dot').classList.toggle('on',online);
  $('#st').textContent=!online?'нет связи…':(S.paired?'на связи':'ждём, пока собеседник откроет ссылку');
}

// ---------- интерфейс ----------
function send(){
  const text=$('#txt').value.trim();if(!text)return;
  const m={id:crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random(),from:S.me,text,ts:Date.now(),ok:0,pub:0};
  S.msgs.push(m);save();$('#txt').value='';grow();render();flush();
  $('#txt').focus();
}
$('#send').onclick=send;
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi/.test(navigator.userAgent)){e.preventDefault();send()}});
$('#txt').addEventListener('input',grow);
function grow(){const t=$('#txt');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';$('#send').disabled=!t.value.trim()}

function render(){
  const L=$('#list');L.innerHTML='';let last=0;
  for(const m of S.msgs){
    if(m.ts-last>3600e3){const d=new Date(m.ts),x=document.createElement('div');x.className='info';
      x.textContent=d.toLocaleDateString('ru',{day:'numeric',month:'long'})+', '+d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});L.append(x)}
    last=m.ts;
    const el=document.createElement('div');el.className='m '+(m.from===S.me?'me':'them');el.textContent=m.text;L.append(el);
  }
  const lm=S.msgs[S.msgs.length-1];
  if(lm&&lm.from===S.me){const w=document.createElement('div');w.className='wait';
    w.textContent=lm.ok?'Доставлено':(lm.pub?'Отправлено':'Отправка…');L.append(w)}
  L.scrollTop=L.scrollHeight;
}

let unread=0;
function notify(text){
  if(!document.hidden)return;
  unread++;document.title=`(${unread}) Сообщения`;try{navigator.vibrate&&navigator.vibrate(150)}catch{}
  if(window.Notification&&Notification.permission==='granted')try{new Notification('Новое сообщение',{body:text.slice(0,100)})}catch{}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){unread=0;document.title='Сообщения'}});
document.addEventListener('click',()=>{try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch{}},{once:true});

$('#more').onclick=()=>{
  const a=prompt('1 — ссылка для собеседника\n2 — очистить переписку\n3 — новый собеседник (сброс)');
  if(a==='1')$('#invite').classList.remove('hide');
  if(a==='2'&&confirm('Удалить переписку на этом телефоне?')){S.msgs=[];save();render()}
  if(a==='3'&&confirm('Сбросить? Связь с текущим собеседником пропадёт.')){localStorage.removeItem(LS);location.reload()}
};

render();status();
initCrypto().then(connect);
</script>
</body>
</html>
